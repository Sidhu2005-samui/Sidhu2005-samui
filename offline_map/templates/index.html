<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Map App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='leaflet.css') }}">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <button id="locate-me">Locate Me</button>
        <div id="status"></div>
    </div>

    <script src="{{ url_for('static', filename='leaflet.js') }}"></script>
    <script>
        // Set Leaflet image path
        L.Icon.Default.imagePath = "{{ url_for('static', filename='images/') }}";

        // Initialize map
        // Since we only have tiles for zoom 0 and 1, we start there.
        var map = L.map('map').setView([0, 0], 1);

        // Add local tile layer
        L.tileLayer('/tiles/{z}/{x}/{y}.png', {
            maxZoom: 1,
            minZoom: 0,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var userMarker;

        document.getElementById('locate-me').addEventListener('click', function() {
            var status = document.getElementById('status');
            status.textContent = "Locating...";

            if (!navigator.geolocation) {
                status.textContent = "Geolocation is not supported by your browser";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    status.textContent = "Location found: " + lat.toFixed(4) + ", " + lon.toFixed(4);

                    if (userMarker) {
                        userMarker.setLatLng([lat, lon]);
                    } else {
                        userMarker = L.marker([lat, lon]).addTo(map);
                    }
                    map.setView([lat, lon], 1);
                },
                function() {
                    status.textContent = "Unable to retrieve your location";
                }
            );
        });
    </script>
</body>
</html>
