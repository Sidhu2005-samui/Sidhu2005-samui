{% extends "layout.html" %}

{% block title %}Storefront - App Store Clone{% endblock %}

{% block content %}
<div class="row mb-4 align-items-center">
    <div class="col-md-6">
        <h1 class="display-5 fw-bold">Discover Apps</h1>
    </div>
    <div class="col-md-6 text-end">
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-primary category-btn active" data-category="">All</button>
            <button type="button" class="btn btn-outline-primary category-btn" data-category="Games">Games</button>
            <button type="button" class="btn btn-outline-primary category-btn" data-category="Tools">Tools</button>
            <button type="button" class="btn btn-outline-primary category-btn" data-category="Social">Social</button>
        </div>
    </div>
</div>

<div class="input-group mb-4 shadow-sm">
    <input type="text" class="form-control" id="search-input" placeholder="Search for apps..." aria-label="Search">
    <button class="btn btn-primary px-4" type="button" id="search-btn">Search</button>
</div>

<div class="row g-4" id="apps-grid">
    <!-- Apps will be dynamically loaded here -->
</div>

<script>
    let currentCategory = '';
    let currentSearch = '';

    async function loadApps() {
        const params = new URLSearchParams();
        if (currentCategory) params.append('category', currentCategory);
        if (currentSearch) params.append('search', currentSearch);

        const response = await fetch(`/api/apps?${params.toString()}`);
        const apps = await response.json();

        const grid = document.getElementById('apps-grid');
        grid.innerHTML = apps.map(app => `
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 app-card shadow-sm border-0" onclick="location.href='/apps/${app.id}'">
                    <div class="card-body text-center p-4">
                        <img src="${app.icon_url || '/static/default-icon.png'}" class="app-icon mb-3 shadow" alt="${app.name}">
                        <h5 class="card-title fw-bold mb-1">${app.name}</h5>
                        <p class="text-muted small mb-3">${app.category || 'App'}</p>
                        <div class="d-flex justify-content-between align-items-center mt-auto">
                            <span class="badge bg-light text-primary border">${app.version}</span>
                            <span class="text-muted small"><i class="bi bi-download"></i> ${app.downloads_count}</span>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.onclick = (e) => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentCategory = e.target.dataset.category;
            loadApps();
        };
    });

    document.getElementById('search-btn').onclick = () => {
        currentSearch = document.getElementById('search-input').value;
        loadApps();
    };

    document.getElementById('search-input').onkeyup = (e) => {
        if (e.key === 'Enter') {
            currentSearch = e.target.value;
            loadApps();
        }
    };

    window.onload = loadApps;
</script>
{% endblock %}
